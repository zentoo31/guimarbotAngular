        <div class="flex flex-row w-3/4 gap-3">
            @for (item of subjectList; track $index) {
                <subject [subject]="item"></subject>

        <div class="flex flex-col w-1/4 bg-cardBackground rounded-md p-4 gap-3">
            <h1 class="text-xl text-white font-bold">Resumen del pedido</h1>
            <div class="flex flex-col gap-4 text-gray-400">
                <div class="flex flex-row justify-between">
                    <p>Subtotal</p>
                    <p>$12</p>
                </div>
                <div class="flex flex-row justify-between">
                    <p>Impuestos (5%)</p>
                    <p>$2</p>
                </div>
                <div class="flex flex-row justify-between text-white border-t-[1px] py-2">
                    <p>Total</p>
                    <p>$14</p>
                </div>
            </div>

        <button class="w-full rounded-lg bg-slate-700 hover:bg-slate-600 p-3 flex flex-row gap-2 justify-center items-center" [routerLink]="['/pay']">
