<main class="flex flex-col h-full bg-[#0F0F0F]">
    <header class="bg-[#121212] w-full flex md:flex-row md:fixed md:z-50 justify-between items-center p-4 text-white space-y-2 md:space-y-0" style="font-family: Inter, sans-serif; font-weight: 500;">
        <div class="flex flex-col md:flex-row items-center justify-center space-x-0 md:space-x-6">
            <img
            src="../assets/SVG_cabezabot.svg"
            alt="GuimarBot Logo"
            class="hover:animate-rotational-wave w-[45px] h-[45px]"
            style="animation-iteration-count: infinite"/>
            <a [routerLink]="['/home']" class="text-sm md:text-xl font-bold">Guimarbot</a>
        </div>
        <div class="flex flex-row items-center space-x-2">
            <input 
                type="text" 
                placeholder="Busca cursos..." 
                class="bg-[#1f1f1f] text-white rounded-lg px-4 py-2 w-50 md:w-auto focus:outline-none focus:ring-2 focus:ring-gray-600 focus:ring-opacity-50"
            />
            
            <button [class.hidden]="!isNotMobile" class="bg-gray-700 text-white px-4 py-2 rounded-lg hover:bg-gray-600 flex flex-row gap-2 items-center">
                <i class="pi pi-search"></i>
                Buscar
            </button>            
        </div>     
    </header>

    <div class="flex flex-col md:flex-row">
        <div [class.hidden]="!isNotMobile" class="justify-start md:fixed lg:w-[10%]  md:z-20 md:mt-20 md:h-screen  bg-[#121212] flex flex-col space-y-6 p-3  text-white" style="font-family: Inter, sans-serif; font-weight: 500;">
            <a [routerLink]="['/dashboard/profile']" routerLinkActive="actived" [class.justify-center]="!isNotMobile" class="hover:bg-gray-700 rounded-lg h-[55px] flex flex-row items-center space-x-5 text-lg p-3 border-[2px] border-transparent">
                <div class="flex justify-center items-center w-7 h-7">
                    <img [src]="user?.profile_picture" [alt]="user?.username" class="rounded-full">
                </div>
                @if (isNotMobile) {
                    <p>Perfil</p>
                }
            </a>
            <a [routerLink]="['/dashboard/achievements']" routerLinkActive="actived" [class.justify-center]="!isNotMobile" class="hover:bg-gray-700 h-[55px] rounded-lg flex flex-row items-center space-x-4 text-lg p-3 border-[2px] border-transparent">

                }

            <a [routerLink]="['/dashboard/subjects']" routerLinkActive = "actived" [class.justify-center] = "!isNotMobile" class="hover:bg-gray-700 h-[55px]   rounded-lg  flex flex-row items-center space-x-4 text-lg p-3 border-[2px] border-transparent">

        </div>

        <div [class.flex]="!isNotMobile"  [class.hidden] = "isNotMobile" class="flex-row justify-between bg-[#121212] p-4 z-50 text-white md:hidden fixed bottom-0 left-0 right-0 shadow-lg">
